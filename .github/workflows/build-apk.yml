name: Construir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Ritmografo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ritmografo-APK
          path: Ritmografo.apk
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Ritmografo.apk \
            --title "Ritmógrafo $TAG" \
            --notes "Descarga Ritmografo.apk e instálalo en tu Android (8.0 o más reciente)." \
            --latest
